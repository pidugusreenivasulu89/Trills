version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e '^MONGODB_URI=' -e '^NEXTAUTH_SECRET=' -e '^NEXTAUTH_URL=' -e '^GOOGLE_CLIENT_ID=' -e '^GOOGLE_CLIENT_SECRET=' -e '^FACEBOOK_CLIENT_ID=' -e '^FACEBOOK_CLIENT_SECRET=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
